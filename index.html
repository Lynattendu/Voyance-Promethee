<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#09061a"
  >

  <title>
    Voyance Prométhée
  </title>

  <!-- ICÔNE IPHONE / IPAD -->
  <link
    rel="apple-touch-icon"
    href="images/Icone-app.PNG"
  >

  <!-- ICÔNE NAVIGATEUR -->
  <link
    rel="icon"
    type="image/png"
    href="images/Icone-app.PNG"
  >

  <!-- STYLE -->
  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       ACCUEIL
  ====================================================== -->

  <main
    class="accueil"
    id="accueil"
  >

    <h1>
      VOYANCE PROMÉTHÉE
    </h1>

    <p class="sous-titre">
      Choisis ton tirage
    </p>


    <!-- TIRAGE 1 CARTE -->

    <button
      class="bouton-tirage"
      data-tirage="1"
      type="button"
    >

      <span class="nom-tirage">
        ⚡ TIRAGE ÉCLAIR
      </span>

      <span class="description">
        1 carte — Une réponse immédiate
      </span>

    </button>


    <!-- TIRAGE 3 CARTES -->

    <button
      class="bouton-tirage"
      data-tirage="3"
      type="button"
    >

      <span class="nom-tirage">
        ✨ TIRAGE CLAIR
      </span>

      <span class="description">
        3 cartes — Comprendre la situation
      </span>

    </button>


    <!-- TIRAGE 5 CARTES -->

    <button
      class="bouton-tirage"
      data-tirage="5"
      type="button"
    >

      <span class="nom-tirage">
        🌙 TIRAGE PROFOND
      </span>

      <span class="description">
        5 cartes — Explorer ce qui agit autour de toi
      </span>

    </button>


    <!-- TIRAGE 7 CARTES -->

    <button
      class="bouton-tirage"
      data-tirage="7"
      type="button"
    >

      <span class="nom-tirage">
        🌌 GRAND TIRAGE
      </span>

      <span class="description">
        7 cartes — Une lecture complète
      </span>

    </button>

  </main>


  <!-- =====================================================
       ÉCRAN DE TIRAGE
  ====================================================== -->

  <section
    class="zone-tirage"
    id="zoneTirage"
    hidden
  >

    <header class="entete-tirage">

      <h2 id="titreTirage">
      </h2>

      <p
        class="description-tirage"
        id="descriptionTirage"
      >
      </p>

    </header>


    <!-- CARTES -->

    <div
      class="cartes-tirage"
      id="cartesTirage"
    >
    </div>


    <!-- ===================================================
         LECTURE APPROFONDIE
    ==================================================== -->

    <section
      class="lecture-approfondie"
      id="lectureApprofondie"
    >

      <button
        class="bouton-lecture"
        id="lectureApprofondieBtn"
        type="button"
        hidden
      >
        🔮 Lecture approfondie
      </button>


      <div
        class="lecture-resultat"
        id="lectureApprofondieZone"
        hidden
      >

        <div class="lecture-entete">

          <div class="lecture-symbole">
            ✦
          </div>

          <h3>
            Lecture approfondie
          </h3>

          <p>
            Les cartes sont maintenant interprétées
            en relation les unes avec les autres.
          </p>

        </div>


        <!-- ÉNERGIE GÉNÉRALE -->

        <section
          class="lecture-section"
          id="lectureEnergieGenerale"
          hidden
        >

          <h4>
            Énergie générale
          </h4>

          <div
            class="lecture-contenu"
            id="lectureEnergieContenu"
          >
          </div>

        </section>


        <!-- ASSOCIATIONS -->

        <section
          class="lecture-section"
          id="lectureAssociations"
        >

          <h4>
            Associations des cartes
          </h4>

          <div
            class="lecture-contenu"
            id="lectureAssociationsContenu"
          >
          </div>

        </section>


        <!-- FAMILLE DOMINANTE -->

        <section
          class="lecture-section"
          id="lectureFamilleDominante"
          hidden
        >

          <h4>
            Influence dominante
          </h4>

          <div
            class="lecture-contenu"
            id="lectureFamilleContenu"
          >
          </div>

        </section>


        <!-- SYNTHÈSE -->

        <section
          class="lecture-section lecture-synthese"
          id="lectureSynthese"
          hidden
        >

          <h4>
            Synthèse
          </h4>

          <div
            class="lecture-contenu"
            id="lectureSyntheseContenu"
          >
          </div>

        </section>

      </div>

    </section>


    <!-- ===================================================
         ACTIONS
    ==================================================== -->

    <div class="actions-tirage">

      <button
        class="bouton-action bouton-nouveau"
        id="nouveauTirageBtn"
        type="button"
      >
        🔄 Nouveau tirage
      </button>

      <button
        class="bouton-action bouton-retour"
        id="retourAccueilBtn"
        type="button"
      >
        ← Retour
      </button>

    </div>

  </section>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script src="script.js"></script>

</body>

</html>
