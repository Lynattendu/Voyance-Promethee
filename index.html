<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voyance Prométhée</title>


  
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;

    background:
      radial-gradient(circle at 50% 12%,
        rgba(111, 82, 255, 0.30) 0%,
        rgba(61, 37, 130, 0.16) 22%,
        transparent 48%
      ),
      radial-gradient(circle at 14% 40%,
        rgba(0, 191, 255, 0.12) 0%,
        transparent 30%
      ),
      radial-gradient(circle at 84% 76%,
        rgba(195, 95, 255, 0.10) 0%,
        transparent 35%
      ),
      linear-gradient(
        180deg,
        #09061a 0%,
        #10092a 48%,
        #040510 100%
      );
  }

  /* halo général derrière le haut de la page */
  body::before {
    content: "";
    position: fixed;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 380px;
    background: radial-gradient(circle,
      rgba(114, 94, 255, 0.18) 0%,
      rgba(72, 198, 255, 0.08) 22%,
      rgba(145, 85, 255, 0.05) 40%,
      transparent 70%
    );
    filter: blur(18px);
    pointer-events: none;
  }

  /* petites étoiles */
  body::after {
    content: "✦     ·        ✧        ·      ✦      ·       ✧     ·      ✦";
    position: fixed;
    top: 9%;
    left: 5%;
    width: 90%;
    font-size: 16px;
    letter-spacing: 22px;
    color: rgba(208, 224, 255, 0.28);
    pointer-events: none;
  }

  .accueil {
    width: 92%;
    max-width: 700px;
    padding: 40px 20px 55px;
    position: relative;
    z-index: 2;
  }

  /* halo diffus de la brèche */
  .accueil::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 170px;
    border-radius: 50%;
    background:
      radial-gradient(circle,
        rgba(178, 240, 255, 0.22) 0%,
        rgba(113, 210, 255, 0.16) 20%,
        rgba(122, 94, 255, 0.12) 42%,
        rgba(95, 53, 180, 0.05) 60%,
        transparent 76%
      );
    filter: blur(10px);
    pointer-events: none;
  }

  /* la crevasse lumineuse */
  .accueil::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 135px;

    background:
      linear-gradient(
        180deg,
        rgba(235, 250, 255, 0.98) 0%,
        rgba(190, 242, 255, 0.96) 12%,
        rgba(129, 223, 255, 0.88) 30%,
        rgba(122, 132, 255, 0.68) 58%,
        rgba(149, 92, 255, 0.28) 82%,
        rgba(149, 92, 255, 0.08) 100%
      );

    clip-path: polygon(
      48% 0%,
      65% 8%,
      60% 18%,
      69% 31%,
      55% 45%,
      66% 58%,
      52% 73%,
      58% 88%,
      43% 100%,
      26% 90%,
      31% 73%,
      21% 57%,
      33% 44%,
      25% 29%,
      37% 14%
    );

    box-shadow:
      0 0 10px rgba(171, 236, 255, 0.90),
      0 0 24px rgba(118, 216, 255, 0.70),
      0 0 52px rgba(130, 80, 255, 0.42);

    pointer-events: none;
  }

  h1 {
    font-size: 42px;
    margin: 120px 0 10px;
    letter-spacing: 1.5px;
    text-shadow:
      0 0 8px rgba(255,255,255,0.82),
      0 0 18px rgba(137, 94, 255, 0.72),
      0 0 42px rgba(66, 207, 255, 0.30);
  }

  .sous-titre {
    font-size: 18px;
    margin-bottom: 36px;
    color: rgba(228, 234, 255, 0.86);
    letter-spacing: 1px;
  }

  .bouton-tirage {
    width: 100%;
    margin: 15px 0;
    padding: 22px 24px;
    border-radius: 22px;
    border: 1px solid rgba(178, 220, 255, 0.35);
    color: white;
    cursor: pointer;
    position: relative;
    overflow: hidden;

    background:
      linear-gradient(
        135deg,
        rgba(126, 83, 220, 0.40),
        rgba(39, 32, 92, 0.58)
      );

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
      0 0 18px rgba(119, 95, 255, 0.18),
      inset 0 0 18px rgba(255,255,255,0.04);

    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease,
      border-color 0.25s ease;
  }

  .bouton-tirage::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    top: -90px;
    left: -70px;
    border-radius: 50%;
    background:
      radial-gradient(
        circle,
        rgba(115, 229, 255, 0.16),
        transparent 68%
      );
    pointer-events: none;
  }

  .bouton-tirage:hover {
    transform: translateY(-3px) scale(1.015);
    border-color: rgba(162, 229, 255, 0.75);
    box-shadow:
      0 0 18px rgba(104, 215, 255, 0.30),
      0 0 35px rgba(134, 77, 255, 0.25),
      inset 0 0 20px rgba(255,255,255,0.05);
  }

  .nom-tirage {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 7px;
    letter-spacing: 0.5px;
    text-shadow: 0 0 10px rgba(169, 216, 255, 0.35);
  }

  .description {
    font-size: 15px;
    color: rgba(229, 232, 255, 0.82);
  }

  @media (max-width: 600px) {
    .accueil {
      padding: 28px 14px 45px;
    }

    .accueil::before {
      width: 120px;
      height: 145px;
      top: -2px;
    }

    .accueil::after {
      width: 28px;
      height: 108px;
      top: 8px;
    }

    h1 {
      font-size: 31px;
      margin-top: 98px;
    }

    .nom-tirage {
      font-size: 20px;
    }

    .bouton-tirage {
      padding: 19px 14px;
    }
  }
</style>


  
</head>


<body>

  <div class="accueil">

    <h1>🔮 VOYANCE PROMÉTHÉE</h1>

    <div class="sous-titre">
      Choisis ton tirage
    </div>


    <button class="bouton-tirage">
      <div class="nom-tirage">
        ⚡ TIRAGE ÉCLAIR
      </div>

      <div class="description">
        1 carte — Une réponse immédiate
      </div>
    </button>


    <button class="bouton-tirage">
      <div class="nom-tirage">
        ✨ TIRAGE CLAIR
      </div>

      <div class="description">
        3 cartes — Comprendre la situation
      </div>
    </button>


    <button class="bouton-tirage">
      <div class="nom-tirage">
        🌙 TIRAGE PROFOND
      </div>

      <div class="description">
        5 cartes — Explorer ce qui agit autour de toi
      </div>
    </button>


    <button class="bouton-tirage">
      <div class="nom-tirage">
        🌌 GRAND TIRAGE
      </div>

      <div class="description">
        7 cartes — Une lecture complète
      </div>
    </button>

  </div>

</body>
</html>
