<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voyance Prométhée</title>

<style>

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;

    background:
      radial-gradient(circle at 50% 15%,
        rgba(105, 74, 255, 0.35) 0%,
        rgba(42, 25, 95, 0.15) 28%,
        transparent 52%
      ),
      radial-gradient(circle at 15% 35%,
        rgba(0, 221, 255, 0.14) 0%,
        transparent 35%
      ),
      radial-gradient(circle at 85% 75%,
        rgba(186, 84, 255, 0.15) 0%,
        transparent 38%
      ),
      linear-gradient(
        180deg,
        #0b0820 0%,
        #100a2d 45%,
        #050713 100%
      );

    position: relative;
  }




  /* PETITES ÉTOILES */

  body::after {
    content:
      "✦     ·        ✧        ·      ✦      ·       ✧     ·      ✦";

    position: fixed;

    top: 8%;
    left: 5%;
    width: 90%;

    font-size: 16px;
    letter-spacing: 22px;

    color: rgba(208, 224, 255, 0.35);

    pointer-events: none;
  }


  .accueil {
    width: 92%;
    max-width: 700px;

    padding: 45px 20px 55px;

    position: relative;
    z-index: 2;
  }


  /* CERCLE / PORTAIL AU DESSUS DU TITRE */

.accueil::before {
  content: "";

  display: block;
  width: 46px;
  height: 120px;

  margin: 0 auto 22px;

  border-radius: 50px;

  background:
    linear-gradient(
      180deg,
      rgba(210, 245, 255, 0.95) 0%,
      rgba(137, 228, 255, 0.85) 18%,
      rgba(124, 130, 255, 0.55) 45%,
      rgba(119, 72, 255, 0.25) 72%,
      rgba(119, 72, 255, 0.06) 100%
    );

  border: 1px solid rgba(177, 236, 255, 0.65);

  box-shadow:
    0 0 10px rgba(126, 224, 255, 0.85),
    0 0 28px rgba(103, 184, 255, 0.65),
    0 0 55px rgba(137, 77, 255, 0.45),
    inset 0 0 14px rgba(255, 255, 255, 0.35);

  position: relative;
}

.accueil::after {
  content: "";

  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);

  width: 90px;
  height: 160px;

  border-radius: 50%;

  border: 1px solid rgba(129, 214, 255, 0.22);

  box-shadow:
    0 0 25px rgba(98, 196, 255, 0.16),
    0 0 50px rgba(153, 84, 255, 0.12);

  pointer-events: none;
}
  h1 {
    font-size: 42px;
    margin: 0 0 10px;

    letter-spacing: 1.5px;

    text-shadow:
      0 0 8px rgba(255,255,255,0.8),
      0 0 18px rgba(137, 94, 255, 0.8),
      0 0 42px rgba(66, 207, 255, 0.35);
  }


  .sous-titre {
    font-size: 18px;
    margin-bottom: 36px;

    color: rgba(228, 234, 255, 0.86);

    letter-spacing: 1px;
  }


  .bouton-tirage {
    width: 100%;

    margin: 15px 0;
    padding: 22px 24px;

    border-radius: 22px;

    border:
      1px solid rgba(178, 220, 255, 0.35);

    color: white;

    cursor: pointer;

    position: relative;
    overflow: hidden;

    background:
      linear-gradient(
        135deg,
        rgba(126, 83, 220, 0.40),
        rgba(39, 32, 92, 0.58)
      );

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
      0 0 18px rgba(119, 95, 255, 0.18),
      inset 0 0 18px rgba(255,255,255,0.04);

    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease,
      border-color 0.25s ease;
  }


  /* REFLET FUTURISTE */

  .bouton-tirage::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -90px;
    left: -70px;

    border-radius: 50%;

    background:
      radial-gradient(
        circle,
        rgba(115, 229, 255, 0.18),
        transparent 68%
      );

    pointer-events: none;
  }


  .bouton-tirage:hover {
    transform:
      translateY(-3px)
      scale(1.015);

    border-color:
      rgba(162, 229, 255, 0.75);

    box-shadow:
      0 0 18px rgba(104, 215, 255, 0.30),
      0 0 35px rgba(134, 77, 255, 0.25),
      inset 0 0 20px rgba(255,255,255,0.05);
  }


  .nom-tirage {
    font-size: 23px;
    font-weight: bold;

    margin-bottom: 7px;

    letter-spacing: 0.5px;

    text-shadow:
      0 0 10px rgba(169, 216, 255, 0.35);
  }


  .description {
    font-size: 15px;

    color:
      rgba(229, 232, 255, 0.82);
  }


  @media (max-width: 600px) {

    h1 {
      font-size: 31px;
    }

    .nom-tirage {
      font-size: 20px;
    }

    .bouton-tirage {
      padding: 19px 14px;
    }
.accueil::before {
  width: 38px;
  height: 95px;
  margin-bottom: 18px;
}

.accueil::after {
  width: 72px;
  height: 128px;
}

      line-height: 61px;
      font-size: 38px;
    }
  }

</style>
</head>


<body>

  <div class="accueil">

    <h1>🔮 VOYANCE PROMÉTHÉE</h1>

    <div class="sous-titre">
      Choisis ton tirage
    </div>


    <button class="bouton-tirage">
      <div class="nom-tirage">
        ⚡ TIRAGE ÉCLAIR
      </div>

      <div class="description">
        1 carte — Une réponse immédiate
      </div>
    </button>


    <button class="bouton-tirage">
      <div class="nom-tirage">
        ✨ TIRAGE CLAIR
      </div>

      <div class="description">
        3 cartes — Comprendre la situation
      </div>
    </button>


    <button class="bouton-tirage">
      <div class="nom-tirage">
        🌙 TIRAGE PROFOND
      </div>

      <div class="description">
        5 cartes — Explorer ce qui agit autour de toi
      </div>
    </button>


    <button class="bouton-tirage">
      <div class="nom-tirage">
        🌌 GRAND TIRAGE
      </div>

      <div class="description">
        7 cartes — Une lecture complète
      </div>
    </button>

  </div>

</body>
</html>
