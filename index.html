<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voyance Prométhée</title>


  
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    position: relative;

    background:
      radial-gradient(circle at 50% 12%,
        rgba(111, 82, 255, 0.30) 0%,
        rgba(61, 37, 130, 0.16) 22%,
        transparent 48%
      ),
      radial-gradient(circle at 14% 40%,
        rgba(0, 191, 255, 0.12) 0%,
        transparent 30%
      ),
      radial-gradient(circle at 84% 76%,
        rgba(195, 95, 255, 0.10) 0%,
        transparent 35%
      ),
      linear-gradient(
        180deg,
        #09061a 0%,
        #10092a 48%,
        #040510 100%
      );
  }

  /* halo général derrière le haut de la page */
  body::before {
    content: "";
    position: fixed;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 380px;
    background: radial-gradient(circle,
      rgba(114, 94, 255, 0.18) 0%,
      rgba(72, 198, 255, 0.08) 22%,
      rgba(145, 85, 255, 0.05) 40%,
      transparent 70%
    );
    filter: blur(18px);
    pointer-events: none;
  }

  /* petites étoiles */
  body::after {
    content: "✦     ·        ✧        ·      ✦      ·       ✧     ·      ✦";
    position: fixed;
    top: 9%;
    left: 5%;
    width: 90%;
    font-size: 16px;
    letter-spacing: 22px;
    color: rgba(208, 224, 255, 0.28);
    pointer-events: none;
  }

  .accueil {
    width: 92%;
    max-width: 700px;
    padding: 40px 20px 55px;
    position: relative;
    z-index: 2;
  }

  /* halo diffus de la brèche */
.accueil::before {
  content: "";
  position: absolute;
  top: 0px;
  left: 50%;
  transform: translateX(-50%);
  width: 240px;
  height: 90px;
  border-radius: 50%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(185, 240, 255, 0.22) 0%,
      rgba(118, 214, 255, 0.15) 28%,
      rgba(132, 92, 255, 0.10) 48%,
      transparent 72%
    );

  filter: blur(12px);
  pointer-events: none;
}
  /* la crevasse lumineuse */
.accueil::after {
  content: "";
  position: absolute;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 24px;

  background:
    linear-gradient(
      90deg,
      rgba(115, 72, 255, 0.05) 0%,
      rgba(154, 94, 255, 0.20) 12%,
      rgba(122, 224, 255, 0.78) 32%,
      rgba(245, 252, 255, 1) 50%,
      rgba(122, 224, 255, 0.78) 68%,
      rgba(154, 94, 255, 0.20) 88%,
      rgba(115, 72, 255, 0.05) 100%
    );

  clip-path: polygon(
    0% 52%,
    8% 42%,
    16% 57%,
    24% 40%,
    34% 56%,
    43% 38%,
    52% 53%,
    61% 39%,
    70% 57%,
    79% 43%,
    88% 58%,
    94% 47%,
    100% 54%,
    100% 70%,
    94% 60%,
    87% 74%,
    79% 59%,
    70% 73%,
    61% 57%,
    52% 69%,
    43% 56%,
    34% 71%,
    24% 55%,
    16% 68%,
    8% 57%,
    0% 65%
  );

  box-shadow:
    0 0 10px rgba(188, 243, 255, 0.95),
    0 0 24px rgba(109, 219, 255, 0.72),
    0 0 48px rgba(136, 82, 255, 0.40);

  pointer-events: none;
}
  h1 {
  font-size: 42px;
  margin: 88px 0 10px;
  letter-spacing: 1.5px;
  text-shadow:
    0 0 8px rgba(255,255,255,0.82),
    0 0 18px rgba(137, 94, 255, 0.72),
    0 0 42px rgba(66, 207, 255, 0.30);
}

  .sous-titre {
    font-size: 18px;
    margin-bottom: 36px;
    color: rgba(228, 234, 255, 0.86);
    letter-spacing: 1px;
  }

  .bouton-tirage {
    width: 100%;
    margin: 15px 0;
    padding: 22px 24px;
    border-radius: 22px;
    border: 1px solid rgba(178, 220, 255, 0.35);
    color: white;
    cursor: pointer;
    position: relative;
    overflow: hidden;

    background:
      linear-gradient(
        135deg,
        rgba(126, 83, 220, 0.40),
        rgba(39, 32, 92, 0.58)
      );

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
      0 0 18px rgba(119, 95, 255, 0.18),
      inset 0 0 18px rgba(255,255,255,0.04);

    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease,
      border-color 0.25s ease;
  }

  .bouton-tirage::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    top: -90px;
    left: -70px;
    border-radius: 50%;
    background:
      radial-gradient(
        circle,
        rgba(115, 229, 255, 0.16),
        transparent 68%
      );
    pointer-events: none;
  }

  .bouton-tirage:hover {
    transform: translateY(-3px) scale(1.015);
    border-color: rgba(162, 229, 255, 0.75);
    box-shadow:
      0 0 18px rgba(104, 215, 255, 0.30),
      0 0 35px rgba(134, 77, 255, 0.25),
      inset 0 0 20px rgba(255,255,255,0.05);
  }

  .nom-tirage {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 7px;
    letter-spacing: 0.5px;
    text-shadow: 0 0 10px rgba(169, 216, 255, 0.35);
  }

  .description {
    font-size: 15px;
    color: rgba(229, 232, 255, 0.82);
  }

  @media (max-width: 600px) {
    .accueil {
      padding: 28px 14px 45px;
    }

  .accueil::before {
  width: 180px;
  height: 70px;
  top: 4px;
}

.accueil::after {
  width: 135px;
  height: 18px;
  top: 26px;
}

    h1 {
  font-size: 31px;
  margin-top: 76px;
}

    .nom-tirage {
      font-size: 20px;
    }

    .bouton-tirage {
      padding: 19px 14px;
    }
  }
</style>


  
</head>


<body>

  <div class="accueil">

    <h1> VOYANCE PROMÉTHÉE</h1>

    <div class="sous-titre">
      Choisis ton tirage
    </div>


    <button class="bouton-tirage" onclick="ouvrirTirage(1)">
  <div class="nom-tirage">
    ⚡ TIRAGE ÉCLAIR
  </div>

  <div class="description">
    1 carte — Une réponse immédiate
  </div>
</button>


<button class="bouton-tirage" onclick="ouvrirTirage(3)">
  <div class="nom-tirage">
    ✨ TIRAGE CLAIR
  </div>

  <div class="description">
    3 cartes — Comprendre la situation
  </div>
</button>


<button class="bouton-tirage" onclick="ouvrirTirage(5)">
  <div class="nom-tirage">
    🌙 TIRAGE PROFOND
  </div>

  <div class="description">
    5 cartes — Explorer ce qui agit autour de toi
  </div>
</button>


<button class="bouton-tirage" onclick="ouvrirTirage(7)">
  <div class="nom-tirage">
    🌌 GRAND TIRAGE
  </div>

  <div class="description">
    7 cartes — Une lecture complète
  </div>
</button>

  </div>

<div id="zoneTirage" style="display:none; width:92%; max-width:1100px; margin:auto; padding:30px 20px; text-align:center;">

  <h2 id="titreTirage"></h2>

  <div id="descriptionTirage" style="margin-bottom:30px; color:rgba(230,235,255,0.85);"></div>

  <div id="cartesTirage"
       style="
         display:flex;
         flex-wrap:wrap;
         justify-content:center;
         gap:18px;
       ">
  </div>

  <button onclick="retourAccueil()"
          style="
            margin-top:35px;
            padding:14px 24px;
            border:none;
            border-radius:16px;
            background:rgba(116,82,210,0.55);
            color:white;
            font-size:16px;
            cursor:pointer;
          ">
    ← Retour
  </button>

</div>

<script>

function ouvrirTirage(nombreCartes) {

  const accueil = document.querySelector(".accueil");
  const zoneTirage = document.getElementById("zoneTirage");
  const titre = document.getElementById("titreTirage");
  const description = document.getElementById("descriptionTirage");
  const zoneCartes = document.getElementById("cartesTirage");

  accueil.style.display = "none";
  zoneTirage.style.display = "block";

  zoneCartes.innerHTML = "";


  if (nombreCartes === 1) {
    titre.textContent = "⚡ Tirage Éclair";
    description.textContent = "Choisis une carte.";
  }

  if (nombreCartes === 3) {
    titre.textContent = "✨ Tirage Clair";
    description.textContent = "Choisis 3 cartes.";
  }

  if (nombreCartes === 5) {
    titre.textContent = "🌙 Tirage Profond";
    description.textContent = "Choisis 5 cartes.";
  }

  if (nombreCartes === 7) {
    titre.textContent = "🌌 Grand Tirage";
    description.textContent = "Choisis 7 cartes.";
  }


  // =========================
  // CRÉATION DU PAQUET
  // =========================

  const paquet = [];

  for (let i = 1; i <= 60; i++) {

    const numero = String(i).padStart(2, "0");

    paquet.push(
      "images/Cartes/V-" + numero + ".PNG"
    );
  }


  // =========================
  // MÉLANGE
  // =========================

  for (let i = paquet.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    const temporaire = paquet[i];

    paquet[i] = paquet[j];
    paquet[j] = temporaire;
  }


  // On prend le nombre de cartes nécessaire

  const cartesChoisies =
    paquet.slice(0, nombreCartes);


  // =========================
  // CRÉATION DES CARTES
  // =========================

  cartesChoisies.forEach(function(imageCarte) {


    // CONTENEUR

    const container =
      document.createElement("div");

    container.style.width = "140px";
    container.style.height = "210px";

    container.style.position = "relative";

    container.style.perspective = "1000px";

    container.style.flex =
      "0 0 140px";


    // CARTE QUI TOURNE

    const flip =
      document.createElement("div");

    flip.style.position = "relative";

    flip.style.width = "100%";
    flip.style.height = "100%";

    flip.style.transformStyle =
      "preserve-3d";

    flip.style.webkitTransformStyle =
      "preserve-3d";

    flip.style.transform =
      "rotateY(0deg)";

    flip.style.webkitTransform =
      "rotateY(0deg)";

    flip.style.transformOrigin =
      "50% 50%";

    flip.style.transition =
      "transform 0.7s ease";

    flip.style.webkitTransition =
      "-webkit-transform 0.7s ease";

    flip.style.cursor = "pointer";


    // =========================
    // DOS
    // =========================

    const dos =
      document.createElement("img");

    dos.src = "images/V-Dos.PNG";

    dos.style.position = "absolute";

    dos.style.top = "0";
    dos.style.left = "0";
    dos.style.right = "0";
    dos.style.bottom = "0";

    dos.style.width = "100%";
    dos.style.height = "100%";

    dos.style.objectFit = "cover";

    dos.style.borderRadius = "14px";

    dos.style.backfaceVisibility =
      "hidden";

    dos.style.webkitBackfaceVisibility =
      "hidden";

    dos.style.transform =
      "rotateY(0deg)";

    dos.style.webkitTransform =
      "rotateY(0deg)";

    dos.style.boxShadow =
      "0 0 20px rgba(120,180,255,0.28)";


    // =========================
    // RECTO
    // =========================

    const recto =
      document.createElement("img");

    recto.src = imageCarte;

    recto.style.position = "absolute";

    recto.style.top = "0";
    recto.style.left = "0";
    recto.style.right = "0";
    recto.style.bottom = "0";

    recto.style.width = "100%";
    recto.style.height = "100%";

    recto.style.objectFit = "cover";

    recto.style.borderRadius = "14px";

    recto.style.backfaceVisibility =
      "hidden";

    recto.style.webkitBackfaceVisibility =
      "hidden";

    recto.style.transform =
      "rotateY(180deg)";

    recto.style.webkitTransform =
      "rotateY(180deg)";

    recto.style.boxShadow =
      "0 0 24px rgba(150,110,255,0.38)";


    // =========================
    // ASSEMBLAGE
    // =========================

    flip.appendChild(dos);

    flip.appendChild(recto);

    container.appendChild(flip);

    zoneCartes.appendChild(container);


    // =========================
    // RETOURNEMENT
    // =========================

    let retournee = false;


    flip.addEventListener(
      "click",
      function() {

        if (retournee) {
          return;
        }

        flip.style.transform =
          "rotateY(180deg)";

        flip.style.webkitTransform =
          "rotateY(180deg)";

        retournee = true;

      }
    );

  });

}


// =========================
// RETOUR ACCUEIL
// =========================

function retourAccueil() {

  document.querySelector(".accueil")
    .style.display = "block";

  document.getElementById("zoneTirage")
    .style.display = "none";

}

</script>


  
</body>
</html>
